[project]
name = "portal-rh-mcp"
version = "1.0.0"
description = "Servidor MCP do Portal de RH — roda no computador de quem usa o Claude Desktop"
requires-python = ">=3.11"
dependencies = [
    # O SDK oficial. `mcp[cli]` traz o `mcp` de linha de comando, útil para
    # depurar sem abrir o Claude.
    # ⚠️ Faixa fechada no major: a 2.0 renomeou `FastMCP` para `MCPServer`,
    # e faixa aberta em dependência já quebrou este projeto sozinha, com o
    # sintoma culpando a credencial (v3.00.4). Ao subir de major, rode o
    # `tests/test_mcp_ferramentas.py`: o import muda de nome.
    "mcp[cli]>=2.0,<3",
    # Mesma biblioteca que o backend usa para falar HTTP — nada de inventar
    # outra só para este pacote.
    "httpx>=0.27",
]

[project.scripts]
portal-rh-mcp = "portal_rh_mcp.servidor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portal_rh_mcp"]
