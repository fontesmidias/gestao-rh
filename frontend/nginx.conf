server {
    listen 80;
    client_max_body_size 50m;

    # O `mime.types` do nginx NÃO conhece `.mjs` e servia o arquivo como
    # `application/octet-stream`. O navegador RECUSA módulo ES com esse tipo
    # ("Strict MIME type checking is enforced for module scripts"), então o
    # worker do pdf.js nunca carregava — e o visualizador de PDF no CELULAR
    # (único caminho no Chrome do Android) caía sempre no "não conseguimos
    # exibir este PDF aqui". Descoberto em 2026-07-31 conferindo a tela, não
    # em teste: o iframe existia, tinha tamanho e o blob estava certo.
    #
    # ⚠️ NÃO usar `types { ... }` aqui: esse bloco SUBSTITUI o mapa inteiro de
    # MIME, e o `index.html` passa a sair como octet-stream — o site vira
    # download. `include mime.types` primeiro, e só então a exceção.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }

    # Backup em lote: ZIP streamado que pode demorar. Desliga o buffering (senão
    # o nginx segura o ZIP inteiro em disco antes de repassar) e alarga o timeout
    # entre blocos (um PDF grande pode passar do default de 60s). Declarado ANTES
    # do /api/ genérico para ter precedência.
    location = /api/rh/arquivo/lote {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # UPLOAD DE DOCUMENTO DO CANDIDATO: o processamento é síncrono e passa por
    # OCR (comprovante de residência, RG), conversão de Word via LibreOffice e
    # gravação no MinIO. Com o default de 60s o nginx cortava a conexão com o
    # servidor ainda trabalhando — e o navegador reporta isso com o MESMO erro
    # de quem está sem sinal, então a pessoa via "você está sem internet" com a
    # internet boa (relato de campo 2026-07-30). O `proxy_request_timeout` alto
    # NÃO é licença para demorar: a v2.31 também cortou o OCR duplicado. Isto é
    # a rede de segurança para o celular em 4G com foto pesada.
    # Regex ANTES do /api/ genérico para ter precedência.
    location ~ ^/api/c/[^/]+/documentos/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 4G ruim manda o corpo em pedaços; o default de 60s derrubaria o envio
        # de uma foto grande antes mesmo de a API vê-lo.
        client_body_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        # $http_host preserva a porta (ex.: IP:8090) — $host a descartaria e os
        # links gerados pelo backend sairiam errados no acesso sem domínio.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Assistente de IA (MCP remoto com OAuth, v3.15) ────────────────────
    #
    # ⚠️ ESTES BLOCOS PRECISAM VIR ANTES DO `location /`, E O MOTIVO É O MESMO
    # DEFEITO DO /assets/ LOGO ABAIXO — medido em 20/08/2026 na homologação:
    # sem eles, `GET /.well-known/oauth-protected-resource` devolve **200 com o
    # HTML do SPA**. O cliente tenta lê-lo como JSON, falha, e reporta "não foi
    # possível conectar ao servidor" — com o serviço no ar, respondendo, e nada
    # no log parecendo errado, porque do ponto de vista do nginx foi um 200
    # bem-sucedido.
    #
    # Os `.well-known` moram na RAIZ por exigência das RFCs 9728/8414 — não dá
    # para escondê-los sob /api/ e deixar o SPA com o resto.
    #
    # `^~` (e não prefixo simples) para vencer qualquer regex que exista ou
    # venha a existir neste arquivo.
    location ^~ /.well-known/oauth-authorization-server {
        proxy_pass http://mcp:8100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://mcp:8100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # As três rotas do fluxo OAuth. `=` (exato) para não capturar caminhos
    # vizinhos do SPA que comecem igual.
    location = /authorize {
        proxy_pass http://mcp:8100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /token {
        proxy_pass http://mcp:8100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /register {
        proxy_pass http://mcp:8100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O endpoint de trabalho. `proxy_buffering off` é obrigatório: o transporte
    # é de longa duração, e com buffering o nginx segura a resposta e o cliente
    # vê a conexão travada (mesmo motivo do /api/rh/arquivo/lote acima).
    location /mcp {
        proxy_pass http://mcp:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ASSET QUE NÃO EXISTE MAIS TEM QUE DAR 404 — NUNCA index.html (incidente de
    # produção 2026-07-29, dois candidatos com a tela em branco).
    #
    # O `try_files $uri /index.html` do bloco abaixo é o certo para ROTA (o SPA
    # trata /c/{token} no cliente), mas era aplicado também a /assets/*.js. Cada
    # build gera um hash novo (index-C1OewSkj.js) e apaga o anterior; a aba que
    # o candidato deixou aberta no celular continua pedindo o arquivo ANTIGO.
    # Sem esta regra o nginx respondia 200 com o HTML do index — e o navegador
    # tentava executar "<!doctype html>" como JavaScript. Resultado: SyntaxError,
    # React não monta, TELA EM BRANCO, e nenhum log de erro em lugar nenhum,
    # porque do ponto de vista do servidor foi um 200 bem-sucedido.
    #
    # Com o 404 o navegador falha no lugar certo, e o main.jsx sabe se recuperar
    # (recarrega uma vez e busca o index.html novo).
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        # O nome carrega o hash do conteúdo: mudou o conteúdo, mudou o nome.
        # Pode ser cacheado para sempre, sem risco de servir versão velha.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # index.html nunca em cache: garante que todo deploy chegue ao navegador.
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }
    }
}
