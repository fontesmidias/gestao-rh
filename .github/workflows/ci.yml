name: integração

# Um único workflow com dois jobs (antes eram dois arquivos separados, e a
# lista de Actions mostrava cada commit duas vezes). Agora cada push aparece
# uma vez só, com os jobs "imagens" e "testes-de-interface" dentro dele.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  imagens:
    # Publica as imagens no GHCR: em push para main e em tags de versão.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servico: api
            contexto: ./backend
            arquivo: ./backend/Dockerfile
          - servico: frontend
            contexto: ./frontend
            arquivo: ./frontend/Dockerfile
          # Transcrição de entrevistas (v2.97): imagem PRÓPRIA porque o
          # faster-whisper pesa ~500 MB e nem a API nem o worker o executam.
          # ⚠️ Sem esta entrada, o `portainer-stack.yml` apontaria para uma
          # imagem que não existe e o container nunca subiria em produção.
          - servico: transcricao
            contexto: ./backend
            arquivo: ./backend/Dockerfile.transcricao
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.servico }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.arquivo }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  testes-de-interface:
    # Playwright contra a stack completa: em push para main e em pull requests
    # (não em tags — a imagem da tag é a mesma já testada no push do main).
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    # `contents: write` é o que permite ao último passo CRIAR A TAG da versão.
    # Sem esta declaração o job herda o padrão do repositório, que pode ser
    # somente leitura — e o `git push origin <tag>` falharia com 403 no fim de
    # um pipeline de 9 minutos, depois de tudo já ter passado.
    permissions:
      contents: write
    # 35, não 25: a execução normal leva 7–11 min (medido em 12 execuções), mas
    # a v3.05.0 foi CANCELADA no teto de 25 com os testes já aprovados — só o
    # download do Playwright estava lento. Cancelamento parece falha na lista de
    # Actions e manda procurar defeito onde não há.
    # ⚠️ Não subir mais que isso: teto alto demais deixa um job TRAVADO consumir
    # o dobro do tempo antes de alguém perceber; o que se quer é margem sobre a
    # variação normal da rede, não paciência infinita.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Rodam ANTES da stack subir: leem o código-fonte, não precisam de banco
      # nem de navegador, e levam segundos. Falhar aqui poupa os ~4 min de
      # build + Playwright. Até a v2.48 nenhum teste Python rodava no CI — o
      # `test_upload_multipart`, escrito justamente para pegar regressão
      # futura, só rodava se alguém lembrasse de executá-lo à mão.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # STDLIB PURA: leem arquivos e conferem regras, sem instalar nada. Os
      # testes estruturais que importam `app.main` ficam de fora — exigiriam
      # FastAPI + todo o resto, trocando segundos por minutos de pipeline.
      # `test_anti_prompt_injection` entrou na v2.70: o cabeçalho dele já dizia
      # "sem banco, sem rede" e o módulo que ele exercita importa só `re` e
      # `secrets` — cabia aqui desde sempre e nunca rodou. É a defesa contra
      # currículo com instrução escondida ("white text resume injection"), num
      # upload PÚBLICO de gente desconhecida: o tipo de regressão que não dá
      # erro, só ranqueia errado.
      - name: Testes estruturais (design system, upload, versão, nomes, migrations, injeção)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          # `test_api_front_existe` (v2.73): varre o JSX e reprova chamada a
          # `api.x()` que não existe no `api.js`. Nasceu de um defeito que o
          # Bruno viu em produção — `api.talentos()` (a certa é `listarTalentos`)
          # derrubava a tela inteira de Entrevistas no ErrorBoundary, e o
          # `.catch(() => {})` ao lado não protegia: `undefined()` é TypeError
          # SÍNCRONO. Stdlib pura, lê arquivos, roda em segundos.
          # `test_creche_competencia` (v3.02): as regras do ciclo mensal do
          # creche decidem DINHEIRO (o teto do posto é teto, não valor fixo) e
          # PRAZO (o que está em atraso, quando lembrar). Stdlib pura — o
          # serviço não importa modelo nem config de propósito. Validado por 3
          # mutações; a que faz "ilegível virar zero" é a mais importante: zero
          # entraria calado na soma e o total sairia menor sem nada acusar.
          # `test_permissoes_declaradas` (v2.86): reprova rota /rh/* que não
          # declara permissão. Sem ele, módulo novo nasce aberto a qualquer
          # pessoa com login — e o defeito não aparece na tela: a rota
          # funciona, devolve 200, e só se descobre quando alguém acha a URL.
          for t in test_design_system test_upload_multipart test_versao test_nomes \
                   test_migration_insert_cru test_anti_prompt_injection \
                   test_api_front_existe test_campo_variaveis \
                   test_permissoes_declaradas test_papel_automacao \
                   test_tela_de_trabalho test_transcricao_paragrafos \
                   test_retranscrever test_diarizacao_diagnostico \
                   test_creche_competencia; do
            echo "::group::$t"
            python "tests/$t.py" || exit 1
            echo "::endgroup::"
          done

      # O do Dexion precisa só de OPENPYXL: ele lê o modelo .xlsx oficial e
      # compara o cabeçalho gerado com ele CÉLULA A CÉLULA — o importador do
      # Dexion recusa (ou, pior, aceita errado) qualquer desvio de forma.
      #
      # `export_dexion.py` mantém os imports de modelo DENTRO de `linha_dexion`
      # justamente para isto: `app.models` puxaria `app.core.config` e
      # `pydantic_settings`, obrigando a instalar meia aplicação para conferir
      # a forma de uma planilha. A parte do teste que precisa dos modelos se
      # anuncia como PULADA e roda no venv completo do backend.
      - name: Teste do export Dexion (fidelidade ao modelo oficial)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pip install --quiet openpyxl
          python tests/test_export_dexion.py

      - name: Cria .env de teste
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=ci
          SECRET_KEY=segredo-apenas-para-ci
          BASE_URL=http://localhost:8090
          FRONTEND_PORT=8090
          POSTGRES_USER=admissao
          POSTGRES_PASSWORD=admissao-ci
          POSTGRES_DB=admissao
          DATABASE_URL=postgresql+psycopg://admissao:admissao-ci@db:5432/admissao
          REDIS_URL=redis://redis:6379/0
          MINIO_ROOT_USER=minio
          MINIO_ROOT_PASSWORD=minio-ci-12345
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=minio
          MINIO_SECRET_KEY=minio-ci-12345
          MINIO_BUCKET=admissao
          MINIO_SECURE=false
          RH_ADMIN_EMAIL=admin@exemplo.com.br
          RH_ADMIN_PASSWORD=senha-ci-12345678
          EOF

      - name: Sobe a stack completa
        run: docker compose --env-file .env
          -f deploy/docker-compose.base.yml -f deploy/docker-compose.ip.yml
          up -d --build

      - name: Aguarda a API responder
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/api/health > /dev/null 2>&1; then
              echo "API no ar"; exit 0
            fi
            sleep 3
          done
          echo "API não subiu a tempo" >&2
          docker compose --env-file .env \
            -f deploy/docker-compose.base.yml -f deploy/docker-compose.ip.yml logs api
          exit 1

      # Testes que precisam da APLICAÇÃO (FastAPI, SQLAlchemy, banco) — rodam
      # DENTRO do container `api`, que já subiu acima com tudo instalado.
      # Acrescentado na v2.70: o comentário do bloco stdlib dizia que estes
      # "trocariam segundos por minutos de pipeline" porque exigiriam instalar
      # meia aplicação — o que deixou de valer no instante em que a stack passou
      # a subir aqui para o Playwright. Custam segundos e cobrem o que mais dói:
      #  · documentos_catalogo → divergência enum × catálogo levanta RuntimeError
      #    NO BOOT: quebra o deploy inteiro, não um endpoint;
      #  · email_templates    → variável obrigatória faltando manda `{{lista}}`
      #    cru para o candidato;
      #  · retomada_acesso    → "o link IDENTIFICA, nunca AUTENTICA" em rota
      #    pública;
      #  · export_tirvu       → o Tirvu recusa (ou aceita ERRADO) desvio de
      #    forma, mesmo argumento que já colocou o Dexion no CI.
      #
      # Os cinco de ENTREVISTAS entraram depois (dívida da v2.64→v2.68): o
      # módulo inteiro — quatro levas, 41 cenários, 9 mutações — nunca rodou
      # aqui. O que ele protege não dá erro quando quebra, só sai errado:
      #  · roteiros_entrevista → o roteiro padrão é o PISO da herança; sem ele
      #    `resolver_roteiro` devolve None e TODA ficha de entrevista abre
      #    vazia, sem erro na tela (defeito real, achado por mutação na v2.66);
      #  · entrevista_documentos → prova que a ficha assinada NÃO entra no
      #    dossiê, que é o documento que CIRCULA (cliente, pasta física). O
      #    default do `dossie.py` é "entra", e o vazamento é uma página a mais
      #    que ninguém confere;
      #  · entrevistas          → justificativa obrigatória por nota e o
      #    snapshot da vaga; o sistema nunca conclui `nao_veio` sozinho;
      #  · entrevista_arquivamento → arquiva, NUNCA apaga (e quem virou
      #    colaborador fica fora do prazo);
      #  · entrevista_anexo     → allowlist, teto e o `close()` do spool numa
      #    rota que recebe currículo anotado;
      #  · lixeira_restaura     → toda entidade que ENTRA na lixeira sabe
      #    VOLTAR. Eram 6 de 8 sem caminho de volta (restaurar dava 422), e o
      #    RH só descobriria no dia em que precisasse desfazer. O teste varre as
      #    chamadas de `mandar_para_lixeira` e cobra o par — a lacuna não volta.
      # Três deles tinham a senha do admin LITERAL na linha do login e teriam
      # dado 401 aqui (o admin nasce com a senha do `.env` deste job) — a mesma
      # armadilha da v2.71, corrigida na mesma leva em que entraram.
      - name: Testes que precisam da aplicação (dentro do container da API)
        run: |
          # A imagem NÃO carrega `tests/` de propósito (o Dockerfile copia só
          # `app`, `migrations` e o entrypoint) — código de teste em imagem de
          # produção é superfície a mais sem benefício. Então os testes são
          # copiados para o container só durante o CI.
          api=$(docker compose --env-file .env \
            -f deploy/docker-compose.base.yml -f deploy/docker-compose.ip.yml \
            ps -q api)
          # `docker cp dir container:/destino` com o destino JÁ EXISTENTE cria
          # `/destino/dir` aninhado, em vez de substituir — e o Python roda a
          # cópia antiga sem avisar. Copiar o CONTEÚDO (`/.`) evita isso e é
          # idempotente entre execuções.
          docker cp backend/tests/. "$api:/app/tests"
          # `test_upload_fecha_spool` entra AQUI, não no bloco stdlib: ele
          # monta um `UploadFile` de verdade para provar que o spool é fechado,
          # e para isso precisa do Starlette.
          # `test_matricula` e `test_nome_arquivo` (v3.04) também: as funções
          # que eles exercitam são de TEXTO, mas moram em `export_tirvu.py`, que
          # importa SQLAlchemy no topo. Foram parar no bloco stdlib primeiro e
          # reprovaram com `ModuleNotFoundError: sqlalchemy` — passavam na
          # máquina de quem escreve (que tem o venv) e falhavam aqui. Antes de
          # pôr teste no bloco stdlib, confira o que o MÓDULO importa, não só o
          # teste.
          for t in test_documentos_catalogo test_email_templates \
                   test_retomada_acesso test_export_tirvu \
                   test_upload_fecha_spool \
                   test_entrevistas test_roteiros_entrevista \
                   test_entrevista_documentos test_entrevista_arquivamento \
                   test_entrevista_anexo test_lixeira_restaura \
                   test_talento_cadastro_rh test_entrevista_sem_vaga \
                   test_documento_especifico test_exigencias \
                   test_uniforme_planilha test_fonte_configuravel \
                   test_permissoes_efeito test_duplicar test_data_documentos \
                   test_talento_campos_longos test_textos_documentos \
                   test_processos test_dossie_pdf_ilegivel \
                   test_token_automacao test_gravacao_entrevista \
                   test_blocos_gravacao test_creche_ciclo_mensal \
                   test_matricula test_nome_arquivo \
                   test_talento_recadastro; do
            echo "::group::$t"
            docker exec -e PYTHONPATH=. "$api" python "tests/$t.py" || exit 1
            echo "::endgroup::"
          done

      # O primeiro acesso descreve a instalação NOVA, e por isso precisa de um
      # banco SEM NENHUM usuário — o `.env` do job já criou o admin no banco
      # principal, então rodá-lo lá reprovaria na pré-condição. Ganha um banco
      # próprio, criado e derrubado aqui.
      #
      # Vale o custo: o que ele protege é o PORTÃO ("a tabela está vazia") de
      # duas rotas PÚBLICAS que criam administrador. Se o portão cair, a tela
      # continua idêntica e o defeito só aparece quando alguém a encontrar.
      - name: Teste do primeiro acesso (banco próprio, sem usuários)
        run: |
          api=$(docker compose --env-file .env \
            -f deploy/docker-compose.base.yml -f deploy/docker-compose.ip.yml \
            ps -q api)
          db=$(docker compose --env-file .env \
            -f deploy/docker-compose.base.yml -f deploy/docker-compose.ip.yml \
            ps -q db)
          docker exec "$db" psql -U admissao -d admissao \
            -c "DROP DATABASE IF EXISTS primeiro_acesso;" \
            -c "CREATE DATABASE primeiro_acesso;"
          url="postgresql+psycopg://admissao:admissao-ci@db:5432/primeiro_acesso"
          docker exec -e PYTHONPATH=. -e DATABASE_URL="$url" "$api" \
            python -m alembic upgrade head
          # RH_ADMIN_* vazios: é o padrão da v2.84 e o que faz a tela existir.
          docker exec -e PYTHONPATH=. -e DATABASE_URL="$url" \
            -e RH_ADMIN_EMAIL= -e RH_ADMIN_PASSWORD= "$api" \
            python tests/test_primeiro_acesso.py || exit 1
          docker exec "$db" psql -U admissao -d admissao \
            -c "DROP DATABASE primeiro_acesso;"

      # O SMOKE — o portão mais completo do projeto, e o que ninguém rodava.
      #
      # 15 etapas ponta a ponta: cadastro pelo RH → link mágico → autosave da
      # ficha → declaração de veracidade → upload de documento (imagem vira PDF
      # no MinIO) → conclusão do envio → aprovação → dossiê. É o único teste que
      # percorre o caminho INTEIRO do candidato; os demais cobrem uma fatia cada.
      #
      # Ficou fora do CI desde sempre, e o preço apareceu na v2.72: ele estava
      # VERMELHO desde a v2.71 e ninguém soube. O `detail` do
      # `upload_seguro._conferir` virou dicionário (passou a dizer a extensão
      # recebida e a lista de aceitos), e a asserção comparava com a string
      # antiga — comportamento CERTO, teste desatualizado, três versões sem
      # ninguém ver. Portão manual é portão que se esquece.
      #
      # Dois defeitos precisaram ser corrigidos para ele rodar AQUI, os dois já
      # conhecidos da casa: (1) `os.environ.update` sobrescrevia a
      # `DATABASE_URL`, mandando-o para um `localhost:55432` que não existe no
      # container; (2) a senha do admin era LITERAL na linha do login, e aqui o
      # admin nasce com a senha do `.env` deste job (a armadilha da v2.71).
      #
      # Passo PRÓPRIO, não dentro do laço acima: ele leva mais que os outros
      # juntos, e quando reprova o log tem que dizer de cara que foi o smoke —
      # não uma linha perdida no meio de um `for`.
      - name: Smoke test — 15 etapas ponta a ponta (dentro do container da API)
        run: |
          api=$(docker compose --env-file .env \
            -f deploy/docker-compose.base.yml -f deploy/docker-compose.ip.yml \
            ps -q api)
          docker exec -e PYTHONPATH=. "$api" python tests/smoke_test.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cache do npm e do navegador do Playwright. Sem eles, cada execução
      # baixava as dependências e o Chromium inteiro de novo — medido: ~2 min
      # dos ~9 min do pipeline, e foi o passo que estourou o teto de 25 min na
      # v3.05.0 (o job foi CANCELADO, não reprovado: os testes tinham passado).
      #
      # A chave inclui o hash do `package-lock.json`: mudou dependência, o cache
      # é ignorado e se instala do zero — cache que não acompanha o lockfile é
      # pior que não ter, porque roda contra a versão errada sem avisar.
      - name: Cache do npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - name: Cache do navegador do Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instala Playwright
        working-directory: frontend
        run: |
          npm install
          # Com o navegador em cache, só as bibliotecas do sistema precisam ser
          # instaladas (`--with-deps` sozinho não baixa o browser de novo).
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Roda os testes de interface
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8090
          RH_EMAIL: admin@exemplo.com.br
          RH_SENHA: senha-ci-12345678
        run: npx playwright test

      - name: Logs da stack (em caso de falha)
        if: failure()
        run: docker compose --env-file .env
          -f deploy/docker-compose.base.yml -f deploy/docker-compose.ip.yml
          logs --tail 100

      # ------------------------------------------------------------------
      # Tag de versão — criada pelo CI, e SÓ quando tudo passou.
      #
      # Por que existe (pedido do Bruno, 19/08/2026): para voltar a uma versão
      # anterior era preciso decorar o SHA do commit. O `type=semver` do job de
      # imagens já estava configurado, mas nunca teve tag git para usar — então
      # nenhuma imagem `:3.09.0` chegou a existir, só `:latest` e `:<sha>`.
      #
      # Três condições, e cada uma evita um erro real:
      #
      # * `if: success()` + posição no FIM do job — a tag só nasce depois dos
      #   testes, do smoke e do Playwright. Marcar antes criaria tag apontando
      #   para código que reprova, e alguém voltaria para ele achando que é uma
      #   versão boa. Foi o que aconteceu hoje: 7 das 9 versões da leva
      #   reprovaram, e todas tinham imagem publicada.
      # * Só no `main` (não em PR nem em tag), senão cada PR tentaria criar a
      #   mesma tag e o push falharia.
      # * Se a tag JÁ existe, não faz nada e diz isso — refazer a versão sem
      #   subir o número é engano de quem esqueceu de atualizar o `versao.py`,
      #   e sobrescrever a tag mudaria o significado de um número já publicado.
      # ------------------------------------------------------------------
      - name: Cria a tag da versão (só com o pipeline verde)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # `sed`, não `grep -oP`: o -P depende do grep ter suporte a PCRE, que
          # varia por ambiente (no Git Bash do Windows ele recusa direto). Ler a
          # versão é o passo do qual tudo aqui depende — não vale prendê-lo a
          # uma flag opcional.
          versao=$(sed -n 's/^VERSAO = "\(.*\)"/\1/p' backend/app/versao.py)
          if [ -z "$versao" ]; then
            echo "::error::não consegui ler VERSAO de backend/app/versao.py"
            exit 1
          fi
          tag="v$versao"
          git fetch --tags --quiet
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::notice::a tag $tag já existe — nada a fazer."
            echo "Se esta era para ser uma versão NOVA, o versao.py não foi atualizado."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$versao"
          git push origin "$tag"
          echo "::notice::tag $tag criada — a partir de agora existe a imagem :$versao"
