# ============================================================================
# Portal de RH (gestao-rh) — STACK COMPLETA PARA PORTAINER (arquivo único)
#
# Usa as imagens prontas publicadas pelo CI no GitHub Container Registry —
# nada de build: cole este arquivo no Portainer (Stacks → Add stack) e defina
# as variáveis de ambiente na própria tela do Portainer (ou cole o conteúdo
# do seu .env em "Environment variables → Advanced mode").
#
# Se os pacotes do GHCR estiverem privados, faça login no registry uma vez:
#   docker login ghcr.io -u SEU_USUARIO_GITHUB -p SEU_TOKEN_PAT  (escopo read:packages)
# Dica: com o repositório público, você pode tornar os pacotes públicos em
#   github.com/fontesmidias?tab=packages → pacote → Package settings → Change
#   visibility — aí o pull dispensa login.
#
# Acesso: http://SEU_IP:${FRONTEND_PORT}  — ⚠️ sem HTTPS: use para validação.
# Com domínio, prefira deploy/docker-compose.traefik.yml (TLS automático).
# ============================================================================

services:
  api:
    image: ghcr.io/fontesmidias/gestao-rh-api:latest
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-admissao}
      MINIO_SECURE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RH_ADMIN_EMAIL: ${RH_ADMIN_EMAIL}
      RH_ADMIN_PASSWORD: ${RH_ADMIN_PASSWORD}
      RH_SESSION_TTL_HOURS: ${RH_SESSION_TTL_HOURS:-12}
      MAGIC_LINK_TTL_HOURS: ${MAGIC_LINK_TTL_HOURS:-72}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: api
      TZ: America/Sao_Paulo
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - logs-data:/var/log/gestao-rh
    networks: [internal]
    restart: unless-stopped
    # Marca a API como saudável só quando ela RESPONDE — `restart: unless-stopped`
    # sozinho só reage a processo morto, e container vivo e travado continuaria
    # "no ar". Usa PYTHON de propósito: a imagem não tem curl nem wget, e um
    # healthcheck com curl marcaria o container como unhealthy para sempre.
    # `start_period` cobre a subida (as migrations rodam no entrypoint).
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  worker:
    image: ghcr.io/fontesmidias/gestao-rh-api:latest
    entrypoint: ["rq"]
    command: ["worker", "--url", "redis://redis:6379/0", "default"]
    environment:
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-admissao}
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: worker
      TZ: America/Sao_Paulo
    depends_on:
      - redis
      - minio
    volumes:
      - logs-data:/var/log/gestao-rh
    networks: [internal]
    restart: unless-stopped

  # Transcrição de entrevistas (v2.97). IMAGEM PRÓPRIA (`-transcricao`): o
  # faster-whisper pesa ~500 MB e nem a API nem o worker o executam. FILA
  # própria: áudio leva minutos e seguraria atrás de si o Match e a indexação
  # de currículo, que levam segundos.
  # ⚠️ Este serviço TEM que existir aqui E no `docker-compose.base.yml` — worker
  # declarado num só dos dois não roda em produção e não gera erro nenhum, só
  # silêncio (v2.66).
  transcricao:
    image: ghcr.io/fontesmidias/gestao-rh-transcricao:latest
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-admissao}
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: transcricao
      TZ: America/Sao_Paulo
    depends_on:
      - redis
      - minio
    volumes:
      - logs-data:/var/log/gestao-rh
      # Sem este volume, cada restart rebaixa o modelo (~500 MB) e a primeira
      # transcrição depois de todo deploy demora muito mais do que deveria.
      - whisper-cache:/root/.cache/huggingface
    networks: [internal]
    restart: unless-stopped

  expurgo:
    image: ghcr.io/fontesmidias/gestao-rh-api:latest
    entrypoint: ["/bin/sh", "-c"]
    # ⚠️ `avisar_vencimentos` FALTAVA aqui (achado da v2.66): o compose local o
    # rodava e o stack de PRODUÇÃO não, então o aviso de certificação vencendo
    # (Onda B, v1.83) nunca saiu na VPS — worker que não é declarado nos DOIS
    # arquivos simplesmente não roda, e nada avisa. É o mesmo par de arquivos
    # que a v2.25 e a v2.29 já cobraram, aqui esquecido numa terceira vez.
    # O lembrete de entrevista (v2.66) mora dentro deste mesmo módulo.
    command: ["while true; do python -m app.workers.expurgo; python -m app.workers.expirar_roteiros; python -m app.workers.avisar_vencimentos; sleep 86400; done"]
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-admissao}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: expurgo
      TZ: America/Sao_Paulo
    depends_on:
      - db
      - minio
    volumes:
      - logs-data:/var/log/gestao-rh
    networks: [internal]
    restart: unless-stopped

  # Vigia da telemetria (v2.25): avalia as regras de alerta a cada 15 minutos e
  # avisa pela matriz de avisos internos. Serviço próprio porque a cadência é
  # muito menor que a do `expurgo` (24h) — embutido lá, o alerta chegaria um dia
  # depois e não serviria para nada.
  alertas:
    image: ghcr.io/fontesmidias/gestao-rh-api:latest
    entrypoint: ["/bin/sh", "-c"]
    # O `logs_email` pega carona aqui (v2.29) em vez de ganhar container
    # próprio: ele só ENVIA quando entra numa janela nova de 6h, então rodar a
    # cada 15 min é barato e faz o envio sobreviver a reinício — um container
    # que estava fora do ar às 12h ainda manda ao voltar.
    command: ["while true; do python -m app.workers.alertas_telemetria; python -m app.workers.logs_email; sleep 900; done"]
    environment:
      SECRET_KEY: ${SECRET_KEY}
      # BASE_URL é obrigatório AQUI (e só aqui): o worker roda no cron, sem
      # `request`, então não há como derivar a URL pública da requisição — sem
      # ele o botão "Ver na telemetria" do e-mail sai vazio.
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-admissao}
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: alertas
      TZ: America/Sao_Paulo
    depends_on:
      - db
    volumes:
      - logs-data:/var/log/gestao-rh
    networks: [internal]
    restart: unless-stopped

  frontend:
    image: ghcr.io/fontesmidias/gestao-rh-frontend:latest
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - api
    networks: [internal]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [internal]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    # --console-address habilita o console web (a base só rodava "server /data").
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # URLs PÚBLICAS (atrás do Nginx/TLS) — sem elas o console gera links
      # internos (minio:9000) que o navegador não alcança e a listagem quebra.
      #   MINIO_SERVER_URL           = https://s3.SEUDOMINIO   (API S3)
      #   MINIO_BROWSER_REDIRECT_URL = https://minio.SEUDOMINIO (console web)
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    ports:
      # publica SÓ no loopback da VPS — o Nginx faz o proxy externo com TLS.
      # ⚠️ Portas de HOST em 91xx (não 9000/9001) p/ NÃO colidir com o Portainer,
      #    que ocupa a 9000 na VPS. O container segue interno em 9000/9001.
      - "127.0.0.1:${MINIO_API_PORT:-9100}:9000"     # API S3 (SDK/boto/mc)
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001" # console web (admin)
    volumes:
      - minio-data:/data
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  postgres-data:
  minio-data:
  # Logs dos serviços em arquivo (v2.29): o `docker logs` morre no restart
  # do container, e é dele que sai o diagnóstico quando alguém trava.
  logs-data:
  # Modelo do faster-whisper (v2.97): baixa uma vez, sobrevive ao restart.
  whisper-cache:
