# ============================================================================
# ATENÇÃO: este arquivo NÃO roda sozinho — é a BASE (serviços comuns) do padrão
# oficial de composição do Docker Compose. Combine-o SEMPRE com uma variante
# (ip/traefik/certbot), que completa portas e TLS. Requer o código-fonte
# (build a partir de ./backend e ./frontend) e o .env na raiz.
#
# 👉 Para subir como STACK no Portainer (sem código-fonte, com imagens prontas
#    do GHCR), use o arquivo único: deploy/portainer-stack.yml
# ============================================================================
# Uso a partir da raiz do repositório:
#   docker compose -f deploy/docker-compose.base.yml -f deploy/docker-compose.ip.yml up -d
#   docker compose -f deploy/docker-compose.base.yml -f deploy/docker-compose.traefik.yml up -d
#   docker compose -f deploy/docker-compose.base.yml -f deploy/docker-compose.certbot.yml up -d

services:
  api:
    build: ../backend
    env_file: ../.env
    depends_on:
      - db
      - redis
      - minio
    environment:
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: api
      TZ: America/Sao_Paulo
    volumes:
      - logs-data:/var/log/gestao-rh
    networks: [internal]
    restart: unless-stopped
    # Idêntico ao do `portainer-stack.yml` — os DOIS arquivos precisam da mesma
    # mudança, senão ela não vale em produção (a armadilha da v2.66). Python em
    # vez de curl: a imagem não tem curl nem wget.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  worker:
    build: ../backend
    # padrão evita URL vazia quando o compose não acha o .env da raiz
    # (interpolação usa o diretório do primeiro -f; ver nota no ip.yml)
    command: rq worker --url ${REDIS_URL:-redis://redis:6379/0} default
    env_file: ../.env
    depends_on:
      - redis
      - minio
    environment:
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: worker
      TZ: America/Sao_Paulo
    volumes:
      - logs-data:/var/log/gestao-rh
    networks: [internal]
    restart: unless-stopped

  # Transcrição de entrevistas (v2.97). Imagem PRÓPRIA: o faster-whisper pesa
  # ~500 MB e a API/worker nunca o executam. Fila PRÓPRIA (`transcricao`):
  # áudio leva minutos e seguraria atrás de si o Match e a indexação de
  # currículo, que levam segundos.
  # ⚠️ Precisa existir também no `portainer-stack.yml` — worker que está só num
  # dos dois NÃO roda em produção, e não gera erro: gera silêncio (v2.66).
  transcricao:
    build:
      context: ../backend
      dockerfile: Dockerfile.transcricao
    env_file: ../.env
    depends_on:
      - redis
      - minio
    environment:
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: transcricao
      TZ: America/Sao_Paulo
    volumes:
      - logs-data:/var/log/gestao-rh
      # O modelo baixa uma vez e fica: sem o volume, cada restart do container
      # rebaixa ~500 MB e a primeira transcrição depois de cada deploy demora
      # muito mais do que deveria.
      - whisper-cache:/root/.cache/huggingface
    networks: [internal]
    restart: unless-stopped

  expurgo:
    build: ../backend
    entrypoint: ["/bin/sh", "-c"]
    # Roda a cada 24h (LGPD + espaço no MinIO): expurgo de arquivos antigos,
    # expiração de roteiros de assinatura vencidos + higienização de externos, e
    # o aviso de certificação prestes a vencer (brigada/NR — v1.83).
    command: ["while true; do python -m app.workers.expurgo; python -m app.workers.expirar_roteiros; python -m app.workers.avisar_vencimentos; sleep 86400; done"]
    env_file: ../.env
    depends_on:
      - db
      - minio
    environment:
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: expurgo
      TZ: America/Sao_Paulo
    volumes:
      - logs-data:/var/log/gestao-rh
    networks: [internal]
    restart: unless-stopped

  # Vigia da telemetria (v2.25): avalia as regras de alerta e avisa pela matriz
  # de avisos internos. Serviço PRÓPRIO, e não mais um comando dentro do
  # `expurgo`, porque a cadência é outra — 15 minutos contra 24 horas. Embutir
  # ali faria o alerta chegar um dia depois, o que anula a razão de existir.
  alertas:
    build: ../backend
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do python -m app.workers.alertas_telemetria; python -m app.workers.logs_email; sleep 900; done"]
    env_file: ../.env
    depends_on:
      - db
    environment:
      LOG_DIR: /var/log/gestao-rh
      LOG_SERVICO: alertas
      TZ: America/Sao_Paulo
    volumes:
      - logs-data:/var/log/gestao-rh
    networks: [internal]
    restart: unless-stopped

  frontend:
    build: ../frontend
    depends_on:
      - api
    networks: [internal]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [internal]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data
    env_file: ../.env
    volumes:
      - minio-data:/data
    networks: [internal]
    restart: unless-stopped

networks:
  internal:

volumes:
  # Logs em arquivo (v2.29) — ver services/logs.py
  logs-data:
  postgres-data:
  minio-data:
  # Modelo do faster-whisper (v2.97): baixa uma vez, sobrevive ao restart.
  whisper-cache:
